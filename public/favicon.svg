<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a6553;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a8568;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#191e26"/>
  
  <!-- Drone shape -->
  <g fill="url(#gradient)">
    <!-- Center body -->
    <circle cx="50" cy="50" r="8" />
    
    <!-- Arms -->
    <rect x="25" y="48" width="18" height="4" rx="2" />
    <rect x="57" y="48" width="18" height="4" rx="2" />
    <rect x="48" y="25" width="4" height="18" rx="2" />
    <rect x="48" y="57" width="4" height="18" rx="2" />
    
    <!-- Propellers -->
    <circle cx="30" cy="30" r="6" opacity="0.8"/>
    <circle cx="70" cy="30" r="6" opacity="0.8"/>
    <circle cx="30" cy="70" r="6" opacity="0.8"/>
    <circle cx="70" cy="70" r="6" opacity="0.8"/>
  </g>
  
  <!-- Letter A -->
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">A</text>
</svg>
